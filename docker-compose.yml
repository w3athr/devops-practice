services:
  weather-service:
    image: "${IMAGE_NAME:-w3athr/weather-app}:${IMAGE_TAG:-v3.2}"
    user: "1000:1000"
    ports:
      - "${PORT}:${PORT}"
    environment:
      - VERSION=${VERSION}
      - AUTHOR=${AUTHOR}
      - SERVICE=${SERVICE}
      - PORT=${PORT}
    secrets:
      - weather_api_key
secrets:
  weather_api_key:
    file: api_key.txt
