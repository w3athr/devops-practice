---
- name: Verify Node Prep
  hosts: all
  tasks:
    - name: Check if k8s sysctl config exists
      ansible.builtin.stat:
        path: /etc/sysctl.d/k8s.conf
      register: sysctl_conf
      when: ansible_facts['virtualization_type'] != 'docker'

    - name: Assert sysctl config is present
      ansible.builtin.assert:
        that: sysctl_conf.stat.exists
        fail_msg: "File /etc/sysctl.d/k8s.conf is missing"
      when: ansible_facts['virtualization_type'] != 'docker'

    - name: Manual check for Docker environment
      ansible.builtin.debug:
        msg: "Skipping file assertions because running inside Docker"
      when: ansible_facts['virtualization_type'] == 'docker'
