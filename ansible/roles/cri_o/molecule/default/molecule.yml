---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: ubuntu-node
    image: jrei/systemd-ubuntu:22.04
    privileged: true
    user: root
    command: /lib/systemd/systemd
    cgroupns_mode: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp
  env:
    ANSIBLE_REMOTE_TMP: /tmp
verifier:
  name: ansible
